name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (e.g. v1.0.0). Leave empty to auto-release package.json version or update latest.'
        required: false
        default: ''
        type: string

# Cancel older superseded branch runs, but never cancel tagged releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  verify:
    name: Verify & Resolve Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_rolling: ${{ steps.meta.outputs.is_rolling }}
      release_title: ${{ steps.meta.outputs.release_title }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web PWA bundle
        run: npm run build

      - name: Build Android web bundle
        run: npm run build:android

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            IS_ROLLING="false"
            TITLE="Alexandria ${TAG}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
            VERSION="${TAG#v}"
            IS_ROLLING="false"
            TITLE="Alexandria ${TAG}"
          elif ! gh release view "v${PKG_VERSION}" >/dev/null 2>&1; then
            # Auto-publish versioned release (e.g. v1.0.0) on push when not yet released
            TAG="v${PKG_VERSION}"
            VERSION="${PKG_VERSION}"
            IS_ROLLING="false"
            TITLE="Alexandria v${PKG_VERSION}"
          else
            TAG="latest"
            VERSION="${PKG_VERSION}"
            IS_ROLLING="true"
            TITLE="Alexandria Latest (v${PKG_VERSION})"
          fi

          echo "Resolved release: tag=${TAG} version=${VERSION} rolling=${IS_ROLLING}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_rolling=${IS_ROLLING}" >> "$GITHUB_OUTPUT"
          echo "release_title=${TITLE}" >> "$GITHUB_OUTPUT"

  build:
    name: Package (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            builder_args: '--linux AppImage deb --x64 --publish never'
            artifact_pattern: |
              release/*.AppImage
              release/*.deb
          - platform: windows
            os: windows-latest
            builder_args: '--win nsis portable --x64 --publish never'
            artifact_pattern: |
              release/*-setup.exe
              release/*-portable.exe
          - platform: macos
            os: macos-latest
            builder_args: '--mac dmg zip --arm64 --publish never'
            artifact_pattern: |
              release/*.dmg
              release/*.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync version for tagged release
        if: needs.verify.outputs.is_rolling == 'false'
        shell: bash
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
          fi

      - name: Build Electron application
        run: npm run build:electron

      - name: Package desktop installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.builder_args }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Package (android)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ -d "${SDK_ROOT}/cmdline-tools/latest/bin" ]]; then
            CMDLINE_BIN="${SDK_ROOT}/cmdline-tools/latest/bin"
          else
            CMDLINE_BIN="$(ls -d "${SDK_ROOT}"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "${CMDLINE_BIN}" || ! -x "${CMDLINE_BIN}/sdkmanager" ]]; then
            echo "Could not find Android sdkmanager under ${SDK_ROOT}/cmdline-tools" >&2
            exit 1
          fi
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${CMDLINE_BIN}" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "Using Android SDK at ${SDK_ROOT} (sdkmanager: ${CMDLINE_BIN}/sdkmanager)"

      - name: Install Android API 36 platform and build-tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Android versionName and versionCode
        shell: bash
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const m = version.match(/^(\d+)\.(\d+)\.(\d+)/);
            const code = m ? Number(m[1]) * 10000 + Number(m[2]) * 100 + Number(m[3]) : 10000;
            const gradlePath = "android/app/build.gradle";
            let content = fs.readFileSync(gradlePath, "utf8");
            content = content.replace(/versionCode\s+\d+/, `versionCode ${code}`);
            content = content.replace(/versionName\s+"[^"]*"/, `versionName "${version}"`);
            fs.writeFileSync(gradlePath, content, "utf8");
            console.log(`Synced Android build.gradle -> versionName=${version} versionCode=${code}`);
          ' "${VERSION}"

      - name: Refresh launcher icons and splash screens
        run: npm run icons

      - name: Build and sync Capacitor Android assets
        run: npm run sync:android

      - name: Build Android Release APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Align and sign release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR="$(ls -d "${SDK_ROOT}"/build-tools/* | sort -V | tail -n 1)"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"

          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [[ -z "${UNSIGNED_APK}" || ! -f "${UNSIGNED_APK}" ]]; then
            echo "Could not find compiled release APK!" >&2
            exit 1
          fi

          mkdir -p release-android
          ALIGNED_APK="release-android/aligned.apk"
          FINAL_APK="release-android/Alexandria-${VERSION}-android-universal.apk"
          KEYSTORE_PATH="/tmp/alexandria-release.keystore"

          if [[ -n "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            KS_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS:-alexandria}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-${KS_PASS}}"
          else
            # Self-sign release APK so Android devices install it cleanly out of the box
            KS_PASS="alexandria-release-key"
            KEY_ALIAS="alexandria"
            KEY_PASS="${KS_PASS}"
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${KS_PASS}" \
              -keypass "${KEY_PASS}" \
              -dname "CN=Alexandria, OU=Library, O=Alexandria, L=Local, S=Local, C=US"
          fi

          "${ZIPALIGN}" -f -p 4 "${UNSIGNED_APK}" "${ALIGNED_APK}"
          "${APKSIGNER}" sign \
            --ks "${KEYSTORE_PATH}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${KS_PASS}" \
            --key-pass "pass:${KEY_PASS}" \
            --out "${FINAL_APK}" \
            "${ALIGNED_APK}"
          "${APKSIGNER}" verify --verbose "${FINAL_APK}"
          rm -f "${ALIGNED_APK}" "${KEYSTORE_PATH}"
          ls -lh "${FINAL_APK}"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-android/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [verify, build, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: dist-release
        run: |
          shopt -s nullglob
          FILES=(*.AppImage *.deb *.exe *.dmg *.zip *.apk)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No release binaries found to publish!" >&2
            exit 1
          fi
          sha256sum "${FILES[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare release notes
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"
          TAG="${{ needs.verify.outputs.tag }}"
          VERSION="${{ needs.verify.outputs.version }}"
          IS_ROLLING="${{ needs.verify.outputs.is_rolling }}"

          {
            if [[ "${IS_ROLLING}" == "true" ]]; then
              echo "Automated rolling desktop & Android build from \`${GITHUB_REF_NAME}\` (\`${SHORT_SHA}\`) — built ${BUILD_DATE}."
            else
              echo "Alexandria **${TAG}** (\`${SHORT_SHA}\`) — built ${BUILD_DATE}."
            fi
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Platform | Format | File |"
            echo "| :--- | :--- | :--- |"
            for file in dist-release/*.AppImage; do
              [[ -e "$file" ]] && echo "| Linux (x64) | AppImage (portable) | \`$(basename "$file")\` |"
            done
            for file in dist-release/*.deb; do
              [[ -e "$file" ]] && echo "| Linux (x64) | Debian / Ubuntu package | \`$(basename "$file")\` |"
            done
            for file in dist-release/*-setup.exe; do
              [[ -e "$file" ]] && echo "| Windows (x64) | Installer (.exe) | \`$(basename "$file")\` |"
            done
            for file in dist-release/*-portable.exe; do
              [[ -e "$file" ]] && echo "| Windows (x64) | Portable (.exe) | \`$(basename "$file")\` |"
            done
            for file in dist-release/*.dmg; do
              [[ -e "$file" ]] && echo "| macOS (Apple Silicon) | Disk Image (.dmg) | \`$(basename "$file")\` |"
            done
            for file in dist-release/*.zip; do
              [[ -e "$file" ]] && echo "| macOS (Apple Silicon) | Archive (.zip) | \`$(basename "$file")\` |"
            done
            for file in dist-release/*.apk; do
              [[ -e "$file" ]] && echo "| Android (8.0+) | Signed APK (.apk) | \`$(basename "$file")\` |"
            done
            echo ""
            echo "Verify downloads against \`SHA256SUMS.txt\`. On Linux, make the AppImage executable before running: \`chmod +x Alexandria-*.AppImage\`. On Android, open the \`.apk\` file to install Alexandria offline."
          } > release-notes.md

      - name: Move rolling latest tag to current commit
        if: needs.verify.outputs.is_rolling == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push -f origin refs/tags/latest

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          TITLE="${{ needs.verify.outputs.release_title }}"
          IS_ROLLING="${{ needs.verify.outputs.is_rolling }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [[ "${IS_ROLLING}" == "true" ]]; then
              OLD_ASSETS="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
              for asset in ${OLD_ASSETS}; do
                gh release delete-asset "${TAG}" "${asset}" --yes || true
              done
            fi
            gh release upload "${TAG}" dist-release/* --clobber
            gh release edit "${TAG}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --latest
          else
            if [[ "${IS_ROLLING}" == "true" ]]; then
              gh release create "${TAG}" dist-release/* \
                --target "${GITHUB_SHA}" \
                --title "${TITLE}" \
                --notes-file release-notes.md \
                --latest
            else
              gh release create "${TAG}" dist-release/* \
                --target "${GITHUB_SHA}" \
                --title "${TITLE}" \
                --notes-file release-notes.md \
                --generate-notes \
                --latest
            fi
          fi
