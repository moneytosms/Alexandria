<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Alexandria — A local-first 3D library for the PDFs you actually read">
  <defs>
    <radialGradient id="bgGlow" cx="76%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#2c2112" stop-opacity="0.95" />
      <stop offset="52%" stop-color="#14100c" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#090807" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E3C27F" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#C8A25B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090807" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D493" />
      <stop offset="50%" stop-color="#C8A25B" />
      <stop offset="100%" stop-color="#7B5E2E" />
    </linearGradient>
    <linearGradient id="brassFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A25B" stop-opacity="0.7" />
      <stop offset="65%" stop-color="#C8A25B" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#C8A25B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1c19" />
      <stop offset="100%" stop-color="#190c0b" />
    </linearGradient>
  </defs>

  <!-- Obsidian Canvas -->
  <rect width="1200" height="420" rx="14" fill="url(#bgGlow)" />

  <!-- Outer & Inner Engraved Brass Frame -->
  <rect x="18" y="18" width="1164" height="384" rx="8" fill="none" stroke="#C8A25B" stroke-opacity="0.32" stroke-width="1.2" />
  <rect x="26" y="26" width="1148" height="368" rx="4" fill="none" stroke="#C8A25B" stroke-opacity="0.14" stroke-width="1" />

  <!-- Corner Architectural Diamonds -->
  <g stroke="#C8A25B" stroke-opacity="0.65" stroke-width="1.1" fill="none">
    <path d="M40 34 L46 40 L40 46 L34 40 Z" />
    <path d="M1160 34 L1166 40 L1160 46 L1154 40 Z" />
    <path d="M40 374 L46 380 L40 386 L34 380 Z" />
    <path d="M1160 374 L1166 380 L1160 386 L1154 380 Z" />
  </g>

  <!-- Subtle Horizontal Archival Grid Hairlines -->
  <line x1="68" y1="92" x2="660" y2="92" stroke="url(#brassFade)" stroke-width="1" />
  <line x1="68" y1="334" x2="680" y2="334" stroke="url(#brassFade)" stroke-width="1" />

  <!-- Left Editorial Typography Block -->
  <text x="68" y="80" fill="#C8A25B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" letter-spacing="3.2">
    LOCAL-FIRST 3D LIBRARY · DESKTOP &amp; WEB
  </text>

  <text x="68" y="184" fill="#F5EFE4" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="500" letter-spacing="5">
    ALEXANDRIA
  </text>

  <text x="70" y="232" fill="#D5CBB9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="400">
    Your PDFs deserve a room of their own.
  </text>

  <text x="70" y="268" fill="#9E9484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5">
    Walkable 3D dark-academia shelves, flicker-free exact-click PDF annotations,
  </text>
  <text x="70" y="290" fill="#9E9484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5">
    millisecond SQLite FTS5 search, and plain-folder sovereignty—zero cloud, zero telemetry.
  </text>

  <!-- Unboxed inline capability strip (zero pills) -->
  <text x="68" y="362" fill="#C8A25B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" letter-spacing="1.6">
    3D GRAND HALL  ·  EXACT-CLICK READER  ·  SQLITE FTS5  ·  LINUX / WINDOWS / MACOS
  </text>

  <!-- Right Centerpiece: Celestial Brass Armillary & Leather Folio -->
  <g transform="translate(925, 210)">
    <circle cx="0" cy="0" r="170" fill="url(#orbGlow)" />

    <!-- Outer Horizon Hairline -->
    <circle cx="0" cy="0" r="154" fill="none" stroke="#C8A25B" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 6" />

    <!-- Main Engraved Meridian Ring -->
    <circle cx="0" cy="0" r="134" fill="none" stroke="url(#brassStroke)" stroke-width="3.2" />
    <circle cx="0" cy="0" r="126" fill="none" stroke="#C8A25B" stroke-opacity="0.45" stroke-width="1" />

    <!-- Degree Tick Marks around Meridian -->
    <g stroke="#E3C27F" stroke-opacity="0.55" stroke-width="1">
      <line x1="0" y1="-134" x2="0" y2="-122" />
      <line x1="0" y1="122" x2="0" y2="134" />
      <line x1="-134" y1="0" x2="-122" y2="0" />
      <line x1="122" y1="0" x2="134" y2="0" />
      <line x1="-94" y1="-94" x2="-86" y2="-86" />
      <line x1="94" y1="-94" x2="86" y2="-86" />
      <line x1="-94" y1="94" x2="-86" y2="86" />
      <line x1="94" y1="94" x2="86" y2="86" />
    </g>

    <!-- Polar Axis Rod & Finials -->
    <line x1="0" y1="-156" x2="0" y2="156" stroke="#8E7342" stroke-width="1.4" />
    <polygon points="0,-166 5,-154 0,-146 -5,-154" fill="#E3C27F" />
    <polygon points="0,166 5,154 0,146 -5,154" fill="#E3C27F" />

    <!-- Tilted Ecliptic Zodiac Band -->
    <g transform="rotate(-23.4)">
      <ellipse cx="0" cy="0" rx="134" ry="44" fill="none" stroke="url(#brassStroke)" stroke-width="4.2" />
      <ellipse cx="0" cy="0" rx="126" ry="38" fill="none" stroke="#8E7342" stroke-width="1" />
    </g>

    <!-- Inner Solstitial Colure -->
    <g transform="rotate(18)">
      <ellipse cx="0" cy="0" rx="52" ry="122" fill="none" stroke="#C8A25B" stroke-opacity="0.65" stroke-width="1.8" />
    </g>

    <!-- Equatorial Ring -->
    <ellipse cx="0" cy="0" rx="112" ry="24" fill="none" stroke="#E3C27F" stroke-opacity="0.52" stroke-width="1.3" />

    <!-- Central Illuminated Leather Folio -->
    <g transform="rotate(-7)">
      <rect x="-42" y="-56" width="84" height="112" rx="4" fill="url(#leatherGrad)" stroke="#E3C27F" stroke-width="1.6" />
      <rect x="-34" y="-48" width="68" height="96" rx="2" fill="none" stroke="#C8A25B" stroke-opacity="0.6" stroke-width="1" />
      <!-- Brass Corner Clasps -->
      <rect x="-42" y="-56" width="11" height="11" fill="#D4AF64" />
      <rect x="31" y="-56" width="11" height="11" fill="#D4AF64" />
      <rect x="-42" y="45" width="11" height="11" fill="#D4AF64" />
      <rect x="31" y="45" width="11" height="11" fill="#D4AF64" />
      <!-- Gilded Book Emblem -->
      <circle cx="0" cy="4" r="18" fill="none" stroke="#E3C27F" stroke-width="1.2" />
      <ellipse cx="0" cy="4" rx="18" ry="6.5" fill="none" stroke="#C8A25B" stroke-width="1" />
      <circle cx="0" cy="4" r="2.6" fill="#F0D493" />
      <line x1="-22" y1="-26" x2="22" y2="-26" stroke="#E3C27F" stroke-width="1.2" />
      <line x1="-14" y1="-20" x2="14" y2="-20" stroke="#C8A25B" stroke-opacity="0.7" stroke-width="1" />
    </g>

    <!-- Cardinal Rivets -->
    <circle cx="134" cy="0" r="4" fill="#F0D493" />
    <circle cx="-134" cy="0" r="4" fill="#F0D493" />

    <!-- Floating Golden Dust Motes -->
    <circle cx="-148" cy="-86" r="2.2" fill="#E3C27F" opacity="0.8" />
    <circle cx="152" cy="-64" r="1.8" fill="#E3C27F" opacity="0.65" />
    <circle cx="138" cy="108" r="2.4" fill="#C8A25B" opacity="0.7" />
    <circle cx="-122" cy="116" r="1.6" fill="#F0D493" opacity="0.55" />
  </g>
</svg>
